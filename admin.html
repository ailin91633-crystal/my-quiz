<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>🏆 晨會測驗 - 發布者管理後台</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: system-ui, sans-serif; background: #f8fafc; padding: 20px; color: #334155; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .btn { padding: 10px 20px; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; margin-right: 10px; }
        .btn-pre { background: #f59e0b; color: white; }
        .btn-post { background: #10b981; color: white; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #e2e8f0; padding: 12px; text-align: left; }
        th { background: #f1f5f9; }
        .badge-up { background: #dcfce7; color: #15803d; padding: 3px 8px; border-radius: 12px; font-weight: bold; }
    </style>
</head>
<body>

<div style="max-width: 900px; margin: 0 auto;">
    <h2>⚙️ 晨會 AI 測驗 - 主持人/管理員控制台</h2>
    
    <div class="card">
        <h3>📍 當前考卷狀態控制</h3>
        <p>目前考卷：<strong id="currentQuizTitle">載入中...</strong></p>
        <p>當前階段：<span id="currentStatus" style="font-weight:bold; font-size:18px;">--</span></p>
        <div>
            <button class="btn btn-pre" onclick="updateStatus('pre')">🟡 切換為【前測階段】(無詳解)</button>
            <button class="btn btn-post" onclick="updateStatus('post')">🟢 切換為【後測階段】(開放詳解)</button>
        </div>
    </div>

    <div class="card">
        <h3>📊 同仁前後測學習成效對比 (Learning Gain)</h3>
        <table>
            <thead>
                <tr>
                    <th>姓名</th>
                    <th>前測得分</th>
                    <th>後測得分</th>
                    <th>進步幅度</th>
                </tr>
            </thead>
            <tbody id="analysisTable">
                <tr><td colspan="4">正在計算分數中...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    const SUPABASE_URL = "https://fileybakrcrpujajioqj.supabase.co"; 
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZpbGV5YmFrcmNycHVqYWppb3FqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkyOTIwMDEsImV4cCI6MjA5NDg2ODAwMX0.JmbCZJHFDdZ22JCx74kJgjZmpo2U6ON9cMoD0lc90pw";
    const mySupabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    let activeQuizId = "";

    async function loadAdminData() {
        // 抓最新考卷
        const { data: quizzes } = await mySupabase.from('quizzes').select('*').order('created_at', { ascending: false }).limit(1);
        if (!quizzes || quizzes.length === 0) return;

        const quiz = quizzes[0];
        activeQuizId = quiz.id;
        document.getElementById('currentQuizTitle').innerText = quiz.quiz_title || '未命名考卷';
        
        const statusMap = { 'pre': '🟡 前測中 (同仁看不到詳解)', 'post': '🟢 後測中 (同仁可看完整解析)' };
        document.getElementById('currentStatus').innerText = statusMap[quiz.status] || quiz.status;

        // 撈取成績進行比對
        const { data: results } = await mySupabase.from('quiz_results').select('*').eq('quiz_id', activeQuizId);
        
        // 整理個人數據
        const userMap = {};
        results.forEach(r => {
            if (!userMap[r.user_name]) userMap[r.user_name] = { pre: '-', post: '-' };
            if (r.test_type === 'pre') userMap[r.user_name].pre = r.score;
            if (r.test_type === 'post') userMap[r.user_name].post = r.score;
        });

        const tbody = document.getElementById('analysisTable');
        tbody.innerHTML = '';

        Object.keys(userMap).forEach(name => {
            const pre = userMap[name].pre;
            const post = userMap[name].post;
            let diffHtml = '-';

            if (pre !== '-' && post !== '-') {
                const diff = post - pre;
                const sign = diff >= 0 ? '+' : '';
                diffHtml = `<span class="badge-up">${sign}${diff} 分</span>`;
            }

            tbody.innerHTML += `
                <tr>
                    <td><strong>${name}</strong></td>
                    <td>${pre !== '-' ? pre + ' 分' : '<span style="color:#94a3b8">未作答</span>'}</td>
                    <td>${post !== '-' ? post + ' 分' : '<span style="color:#94a3b8">未作答</span>'}</td>
                    <td>${diffHtml}</td>
                </tr>
            `;
        });
    }

    async function updateStatus(newStatus) {
        if (!activeQuizId) return;
        await mySupabase.from('quizzes').update({ status: newStatus }).eq('id', activeQuizId);
        alert(`已成功切換為【${newStatus === 'pre' ? '前測' : '後測'}】階段！`);
        loadAdminData();
    }

    window.onload = loadAdminData;
</script>
</body>
</html>
